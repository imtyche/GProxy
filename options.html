<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="title-options">GProxy Options</title>
    <style>
        /* ========== SCI-FI HUD / CYBER TERMINAL THEME ========== */
        :root {
            --hud-bg: #05070f;
            --hud-panel: #0a0f1c;
            --hud-surface: #0d1525;
            --hud-border: #1a2a4a;
            --hud-accent: #00f0ff;
            --hud-accent2: #00aaff;
            --hud-accent3: #ff00aa;
            --hud-text: #c8d8f0;
            --hud-muted: #4a6080;
            --hud-success: #00ff9d;
            --hud-error: #ff3355;
            --hud-warning: #ffaa00;
            --hud-glow: 0 0 12px rgba(0, 240, 255, 0.35);
            --font-mono: 'Cascadia Code', 'Consolas', 'SF Mono', 'Monaco', 'Courier New', monospace;
            --font-ui: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: var(--font-ui);
            background: var(--hud-bg);
            color: var(--hud-text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 28px 16px;
            /* Subtle grid + radial glow */
            background-image:
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(0, 240, 255, 0.08), transparent 60%),
                linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            background-attachment: fixed;
            overflow-x: hidden;
        }

        /* Scanline overlay (very subtle) */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 0, 0, 0.08) 2px,
                rgba(0, 0, 0, 0.08) 4px
            );
            pointer-events: none;
            z-index: 9999;
            opacity: 0.4;
        }

        /* Main container – HUD panel */
        .container {
            width: 100%;
            max-width: 860px;
            background: var(--hud-panel);
            border: 1px solid var(--hud-border);
            position: relative;
            padding: 0;
            box-shadow:
                0 0 0 1px rgba(0, 240, 255, 0.08),
                0 0 40px rgba(0, 240, 255, 0.06),
                inset 0 0 60px rgba(0, 20, 40, 0.4);
            /* Angled cyber corners via clip-path */
            clip-path: polygon(
                0 12px, 12px 0,
                calc(100% - 12px) 0, 100% 12px,
                100% calc(100% - 12px), calc(100% - 12px) 100%,
                12px 100%, 0 calc(100% - 12px)
            );
        }

        /* Corner brackets (HUD frame) */
        .container::before,
        .container::after {
            content: '';
            position: absolute;
            width: 28px;
            height: 28px;
            border: 2px solid var(--hud-accent);
            pointer-events: none;
            z-index: 2;
        }
        .container::before {
            top: 6px;
            left: 6px;
            border-right: none;
            border-bottom: none;
            box-shadow: -2px -2px 8px rgba(0, 240, 255, 0.3);
        }
        .container::after {
            bottom: 6px;
            right: 6px;
            border-left: none;
            border-top: none;
            box-shadow: 2px 2px 8px rgba(0, 240, 255, 0.3);
        }

        /* Extra corner accents via child */
        .hud-corners {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 2;
        }
        .hud-corners span {
            position: absolute;
            width: 22px;
            height: 22px;
            border: 2px solid var(--hud-accent3);
            opacity: 0.7;
        }
        .hud-corners span:nth-child(1) {
            top: 6px; right: 6px;
            border-left: none; border-bottom: none;
        }
        .hud-corners span:nth-child(2) {
            bottom: 6px; left: 6px;
            border-right: none; border-top: none;
        }

        /* Header bar – command center style */
        .header-bar {
            background: linear-gradient(90deg, rgba(0, 240, 255, 0.12) 0%, rgba(0, 170, 255, 0.06) 50%, transparent 100%);
            border-bottom: 1px solid var(--hud-border);
            padding: 14px 28px;
            display: flex;
            align-items: center;
            gap: 16px;
            position: relative;
        }
        .header-bar::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, var(--hud-accent), transparent 70%);
            opacity: 0.6;
        }

        .header-bar .logo {
            font-family: var(--font-mono);
            font-size: 18px;
            font-weight: 700;
            color: var(--hud-accent);
            letter-spacing: 2px;
            text-shadow: 0 0 12px rgba(0, 240, 255, 0.6);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header-bar .logo .icon {
            font-size: 22px;
            filter: drop-shadow(0 0 6px var(--hud-accent));
        }

        .header-bar .sys-status {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 18px;
            font-family: var(--font-mono);
            font-size: 11px;
            letter-spacing: 1px;
            color: var(--hud-muted);
            text-transform: uppercase;
        }
        .header-bar .sys-status .pulse {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--hud-success);
            box-shadow: 0 0 8px var(--hud-success);
            animation: pulse-dot 2s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.85); }
        }

        .lang-switch {
            background: rgba(0, 240, 255, 0.08);
            border: 1px solid var(--hud-border);
            color: var(--hud-accent);
            padding: 5px 12px;
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s;
            clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
        }
        .lang-switch:hover {
            background: rgba(0, 240, 255, 0.2);
            box-shadow: var(--hud-glow);
            color: #fff;
        }

        /* Content area */
        .content {
            padding: 28px 30px 32px;
        }

        /* Section headers */
        .section {
            margin-bottom: 28px;
            position: relative;
        }
        .section:last-child {
            margin-bottom: 0;
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 18px;
            font-family: var(--font-mono);
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--hud-accent);
        }
        .section-title::before {
            content: '//';
            color: var(--hud-accent3);
            font-weight: 700;
        }
        .section-title .line {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, var(--hud-border), transparent);
            margin-left: 8px;
        }

        /* Form layout */
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px 22px;
            margin-bottom: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-family: var(--font-mono);
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--hud-muted);
        }

        select, input, textarea {
            width: 100%;
            padding: 12px 14px;
            background: var(--hud-surface);
            color: var(--hud-text);
            border: 1px solid var(--hud-border);
            font-family: var(--font-mono);
            font-size: 13px;
            transition: all 0.2s ease;
            outline: none;
            /* Slight angle */
            clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px));
        }

        select:focus, input:focus, textarea:focus {
            border-color: var(--hud-accent);
            box-shadow: 0 0 0 1px rgba(0, 240, 255, 0.25), 0 0 16px rgba(0, 240, 255, 0.12);
            background: #0f1a2e;
        }

        select option {
            background: var(--hud-panel);
            color: var(--hud-text);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
            line-height: 1.5;
        }

        /* Custom HUD scrollbar for Bypass List */
        #bypass-list {
            scrollbar-width: thin;              /* Firefox */
            scrollbar-color: rgba(0, 240, 255, 0.4) #0a1220; /* thumb track */
        }
        #bypass-list::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }
        #bypass-list::-webkit-scrollbar-track {
            background: #0a1220;
            border-left: 1px solid #1a3a5a;
            border-radius: 0;
        }
        #bypass-list::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, rgba(0, 240, 255, 0.5) 0%, rgba(0, 170, 255, 0.28) 100%);
            border: 2px solid #0a1220;
            border-radius: 2px;
            min-height: 40px;
        }
        #bypass-list::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, rgba(0, 240, 255, 0.75) 0%, rgba(0, 170, 255, 0.5) 100%);
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
        }
        #bypass-list::-webkit-scrollbar-thumb:active {
            background: #00f0ff;
        }
        #bypass-list::-webkit-scrollbar-corner {
            background: #0a1220;
        }

        /* Status panel */
        .status-panel {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 18px;
            background: var(--hud-surface);
            border: 1px solid var(--hud-border);
            position: relative;
            clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
        }
        .status-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 3px;
            height: 100%;
            background: var(--hud-accent);
            opacity: 0.6;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            flex-shrink: 0;
            transition: all 0.3s;
        }
        .status-dot.connected {
            background: var(--hud-success);
            box-shadow: 0 0 10px var(--hud-success), 0 0 20px rgba(0, 255, 157, 0.3);
            animation: pulse-dot 1.8s ease-in-out infinite;
        }
        .status-dot.disconnected {
            background: var(--hud-error);
            box-shadow: 0 0 10px var(--hud-error);
        }

        .status-text-small {
            font-family: var(--font-mono);
            font-size: 13px;
            color: var(--hud-text);
            flex: 1;
        }

        .status-mode {
            font-family: var(--font-mono);
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 4px 10px;
            border: 1px solid var(--hud-border);
            color: var(--hud-muted);
        }

        /* Buttons */
        .controls {
            display: flex;
            gap: 12px;
            margin-top: 18px;
            flex-wrap: wrap;
        }

        .btn-primary, .btn-secondary, .btn-danger {
            flex: 1;
            min-width: 140px;
            padding: 13px 20px;
            font-family: var(--font-mono);
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            border: none;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.25) 0%, rgba(0, 170, 255, 0.15) 100%);
            color: var(--hud-accent);
            border: 1px solid var(--hud-accent);
            clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.4) 0%, rgba(0, 170, 255, 0.25) 100%);
            box-shadow: 0 0 24px rgba(0, 240, 255, 0.3);
            color: #fff;
            text-shadow: 0 0 8px var(--hud-accent);
        }
        .btn-primary:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background: var(--hud-surface);
            color: var(--hud-text);
            border: 1px solid var(--hud-border);
            clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
        }
        .btn-secondary:hover {
            border-color: var(--hud-muted);
            background: #121c30;
            color: #fff;
        }

        .btn-danger {
            background: linear-gradient(135deg, rgba(255, 51, 85, 0.2) 0%, rgba(180, 0, 40, 0.15) 100%);
            color: var(--hud-error);
            border: 1px solid var(--hud-error);
            clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
        }

        /* Hint text */
        .bypass-text {
            color: var(--hud-muted);
            font-size: 12px;
            margin-bottom: 12px;
            line-height: 1.5;
            font-family: var(--font-ui);
        }
        .bypass-text code {
            background: rgba(0, 240, 255, 0.08);
            padding: 1px 6px;
            color: var(--hud-accent);
            font-family: var(--font-mono);
            font-size: 11px;
            border: 1px solid rgba(0, 240, 255, 0.15);
        }

        /* Toast / feedback */
        .toast {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--hud-panel);
            border: 1px solid var(--hud-accent);
            color: var(--hud-accent);
            padding: 12px 24px;
            font-family: var(--font-mono);
            font-size: 13px;
            letter-spacing: 1px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
            z-index: 10000;
            box-shadow: var(--hud-glow);
            clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px));
        }
        .toast.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }
        .toast.error {
            border-color: var(--hud-error);
            color: var(--hud-error);
            box-shadow: 0 0 12px rgba(255, 51, 85, 0.3);
        }

        /* Responsive */
        @media (max-width: 640px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            .content {
                padding: 20px 18px 24px;
            }
            .header-bar {
                padding: 12px 16px;
                flex-wrap: wrap;
            }
            .header-bar .sys-status {
                width: 100%;
                margin-left: 0;
                margin-top: 6px;
                justify-content: space-between;
            }
            .controls {
                flex-direction: column;
            }
            .btn-primary, .btn-secondary {
                min-width: 100%;
            }
        }

        /* Hide old mobile lang if present */
        .lang-container { display: none; }

        /* General settings – checkbox row */
        .switch-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            background: var(--hud-surface);
            border: 1px solid var(--hud-border);
            cursor: pointer;
            font-family: var(--font-ui);
            font-size: 13px;
            color: var(--hud-text);
            clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
        }
        .switch-row input[type="checkbox"] {
            width: 16px;
            height: 16px;
            min-width: 16px;
            padding: 0;
            margin: 0;
            background: transparent;
            border: 1px solid var(--hud-border);
            clip-path: none;
            accent-color: var(--hud-accent);
            cursor: pointer;
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="hud-corners">
            <span></span>
            <span></span>
        </div>

        <div class="header-bar">
            <div class="logo">
                <span class="icon">⚡</span>
                <span>GPROXY</span>
            </div>
            <div class="sys-status">
                <span class="pulse"></span>
                <span>SYSTEM ONLINE</span>
                <div class="lang-switch" id="lang-switch-desktop">EN</div>
            </div>
        </div>

        <div class="content">
            <!-- Proxy Settings -->
            <div class="section">
                <div class="section-title">
                    <span data-i18n="section_proxy">代理服务器设置</span>
                    <span class="line"></span>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="proxy-scheme" data-i18n="label_scheme">协议</label>
                        <select id="proxy-scheme">
                            <option value="http">HTTP</option>
                            <option value="https">HTTPS</option>
                            <option value="socks4">SOCKS4</option>
                            <option value="socks5">SOCKS5</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="proxy-host" data-i18n="label_host">主机地址</label>
                        <input type="text" id="proxy-host" placeholder="127.0.0.1" spellcheck="false">
                    </div>
                </div>
                <div class="form-group">
                    <label for="proxy-port" data-i18n="label_port">端口</label>
                    <input type="number" id="proxy-port" placeholder="2334" min="1" max="65535">
                </div>
            </div>

            <!-- Status -->
            <div class="section">
                <div class="section-title">
                    <span data-i18n="section_status">连接状态</span>
                    <span class="line"></span>
                </div>
                <div class="status-panel">
                    <span class="status-dot connected" id="status-dot"></span>
                    <span class="status-text-small" id="status-text">检测中...</span>
                    <span class="status-mode" id="proxy-mode-text">--</span>
                </div>
            </div>

            <!-- Bypass List -->
            <div class="section">
                <div class="section-title">
                    <span data-i18n="section_bypass">绕行名单</span>
                    <span class="line"></span>
                </div>
                <p class="bypass-text" data-i18n="hint_bypass">
                    以下域名和 IP 将直接连接，不经过代理服务器。支持通配符，例如 <code>*baidu.com</code>
                </p>
                <textarea id="bypass-list" rows="4" placeholder="*baidu.com&#10;localhost&#10;127.0.0.1" spellcheck="false"></textarea>
                <div class="controls">
                    <button id="btn-save" class="btn-primary" data-i18n="btn_save">保存并更新配置</button>
                    <button id="btn-reset" class="btn-secondary" data-i18n="btn_reset">恢复默认设置</button>
                </div>
            </div>

            <!-- General -->
            <div class="section">
                <div class="section-title">
                    <span data-i18n="section_general">常规</span>
                    <span class="line"></span>
                </div>
                <label class="switch-row" for="show-floating-toggle">
                    <input type="checkbox" id="show-floating-toggle">
                    <span data-i18n="label_show_ball">在页面上显示悬浮开关</span>
                </label>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="i18n.js"></script>
    <script src="options.js"></script>
</body>
</html>
